<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PKC-Js Benchmarks</title>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 20px;
    }
    h1, h2, h3 {
      color: #ffffff;
      font-weight: 600;
      margin: 0 0 12px 0;
      user-select: none;
    }
    h2 {
      cursor: pointer;
      padding: 8px 0;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.3em;
      margin-bottom: 0;
    }
    h2 .arrow {
      display: inline-block;
      transition: transform 0.3s ease;
    }
    .collapsed > h2 .arrow {
      transform: rotate(90deg);
    }
    .section {
      margin-bottom: 40px;
      transition: margin-bottom 0.35s ease;
    }
    .section.collapsed {
      margin-bottom: 8px;
    }
    .content {
      overflow: hidden;
      transition: max-height 0.35s ease, opacity 0.35s ease;
      max-height: 1000000px;
      opacity: 1;
    }
    .content.collapsed {
      max-height: 0;
      opacity: 0;
      pointer-events: none;
      user-select: none;
    }
    .chart-container {
      max-width: 900px;
      margin-bottom: 40px;
      aspect-ratio: 16 / 9;
      background-color: #1e1e1e;
      padding: 16px 24px 24px 24px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
    }
    .chart-container canvas {
      width: 100% !important;
      height: 100% !important;
    }
    .env-badge {
      font-size: 0.6em;
      font-weight: 500;
      color: #121212;
      background-color: #ffb74d;
      border-radius: 6px;
      padding: 2px 8px;
      margin-left: 8px;
      vertical-align: middle;
      cursor: help;
    }
    .type-subtitle {
      font-size: 0.9em;
      color: #bbbbbb;
      margin: 0 0 16px 0;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>PKC-Js Benchmarks</h1>
  <div id="charts"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    const palette = [
      '#90caf9', '#f48fb1', '#a5d6a7', '#ffe082',
      '#ce93d8', '#80deea', '#fdd835', '#bcaaa4',
    ];

    // Map pkc-js commit hashes -> published npm versions via each version's gitHead.
    // Fetched live so newly published versions appear automatically; commits with no
    // published version (pre-release or dev-between-releases) fall back to a short hash.
    async function fetchCommitToVersion() {
      try {
        const res = await fetch('https://registry.npmjs.org/@pkcprotocol%2fpkc-js');
        const versions = (await res.json()).versions || {};
        const map = {};
        for (const [version, meta] of Object.entries(versions)) {
          if (meta && meta.gitHead) map[meta.gitHead] = version;
        }
        return map;
      } catch (e) {
        console.warn('could not fetch pkc-js versions, falling back to commit hashes', e);
        return {};
      }
    }

    async function run() {
      const [res, commitToVersion] = await Promise.all([
        // ?report=<url> charts another all.json (e.g. a local one while working on the harness)
        fetch(new URLSearchParams(location.search).get('report') || 'https://raw.githubusercontent.com/pkcprotocol/pkc-js-benchmarks/refs/heads/master/reports/all.json'),
        fetchCommitToVersion(),
      ]);
      const data = (await res.json()).flat();

      // Label a commit by its published pkc-js version when known, else a short hash.
      const commitLabel = (hash) => (commitToVersion[hash] ? 'v' + commitToVersion[hash] : (hash || 'unknown').slice(0, 7));

      // Group by type, then name, then runtime
      const grouped = {};
      for (const item of data) {
        const { type, name, runtime } = item;
        if (!type || !name || !runtime) continue;
        if (!grouped[type]) grouped[type] = {};
        if (!grouped[type][name]) grouped[type][name] = {};
        if (!grouped[type][name][runtime]) grouped[type][name][runtime] = [];
        grouped[type][name][runtime].push(item);
      }

      const chartsDiv = document.getElementById('charts');
      const formatType = str => str.replace('BenchmarkOptions', '').replace(/([a-z])([A-Z])/g, '$1 $2').toUpperCase();
      // which numeric keys are charted, and on which axis: by unit suffix
      const unitOf = key =>
        /TimeSeconds$/.test(key) ? 'Seconds'
        : /PerSecond$/.test(key) ? 'PerSecond'
        : /MB$/.test(key) ? 'MB'
        : /Ms$/.test(key) ? 'Ms'
        : /Bytes$/.test(key) ? 'Bytes'
        : /Percent$/.test(key) ? 'Percent'
        : /Count$/.test(key) ? 'Count'
        : null;
      const unitOrder = ['Seconds', 'PerSecond', 'Ms', 'MB', 'Bytes', 'Percent', 'Count'];
      const unitLabels = {Seconds: 'Seconds', PerSecond: 'Per second', Ms: 'Milliseconds', MB: 'MB', Bytes: 'Bytes', Percent: '%', Count: 'Count'};
      // metadata, not measurements (anchor holds ratios keyed by metric name)
      const skippedKeys = new Set(['environmentDependent', 'timestamp', 'environment', 'anchor', 'topFunctions', 'pkcJsCommitHash', 'measuredAt']);
      const prefixedKeys = new Set(['process', 'communityProcess', 'aggregate', 'cpuProfile', 'communityCpuProfile']);
      const compareVersions = (a, b) => {
        const pa = a.split('-')[0].split('.').map(Number), pb = b.split('-')[0].split('.').map(Number);
        for (let i = 0; i < 3; i++) if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) - (pb[i] || 0);
        return 0;
      };
      const prettifyLabel = label => {
        let cleaned = label.replace(/TimeSeconds$/i, '');
        cleaned = cleaned.replace(/([a-z])([A-Z])/g, '$1 $2');
        return cleaned.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
      };

      function setupCollapsible(section, contentDiv, header) {
        header.addEventListener('click', () => {
          const isCollapsed = contentDiv.classList.toggle('collapsed');
          header.classList.toggle('collapsed');
          section.classList.toggle('collapsed', isCollapsed);
        });
      }

      for (const [type, namesObj] of Object.entries(grouped)) {
        const section = document.createElement('div');
        section.className = 'section';

        const typeHeader = document.createElement('h2');
        typeHeader.innerHTML = `<span class="arrow">▼</span>${formatType(type)}`;
        section.appendChild(typeHeader);

        const contentDiv = document.createElement('div');
        contentDiv.className = 'content';
        section.appendChild(contentDiv);

        setupCollapsible(section, contentDiv, typeHeader);
        chartsDiv.appendChild(section);

        // Get all names sorted in their insertion order (to keep order consistent)
        const nameOrder = Object.keys(namesObj);

        for (const name of nameOrder) {
          const runtimesObj = namesObj[name];

          // Sort runtimes alphabetically to keep consistent order
          const runtimesSorted = Object.keys(runtimesObj).sort();

          for (const runtime of runtimesSorted) {
            const benchmarks = runtimesObj[runtime];

            // metric -> commit -> values, per unit. A metric's unit is its key suffix; a key like
            // selfMsByPackage gives its children (package names) its unit. Keys under process,
            // communityProcess, aggregate, cpuProfile, ... are prefixed with that parent so the
            // benchmark process and the community process don't merge into one series.
            const metricsByUnit = {};
            const environmentDependent = benchmarks.some(e => e.environmentDependent);
            const commitTimestampMap = {};

            for (const entry of benchmarks) {
              let ts = entry.timestamp;
              if (!ts) continue;
              const hash = entry.pkcJsCommitHash || 'unknown';
              commitTimestampMap[hash] = Math.min(commitTimestampMap[hash] ?? Infinity, ts);

              const add = (unit, metric, val) => {
                if (!metricsByUnit[unit]) metricsByUnit[unit] = {};
                if (!metricsByUnit[unit][metric]) metricsByUnit[unit][metric] = {};
                if (!metricsByUnit[unit][metric][hash]) metricsByUnit[unit][metric][hash] = [];
                metricsByUnit[unit][metric][hash].push(val);
              };
              function extractMetrics(obj, prefix) {
                if (!obj || typeof obj !== 'object') return;
                for (const [key, val] of Object.entries(obj)) {
                  if (skippedKeys.has(key)) continue;
                  if (typeof val === 'number') {
                    const unit = unitOf(key);
                    if (!unit) continue;
                    if (unit === 'Seconds' && type.toLowerCase().includes('publish') && !type.startsWith('localPublish') && !key.toLowerCase().includes('challenge')) continue;
                    add(unit, prefix ? `${prefix} ${key}` : key, val);
                  } else if (val && typeof val === 'object') {
                    const byUnit = key.match(/(TimeSeconds|MB|Ms|Bytes|Count|Percent|PerSecond)By[A-Z]\w*$/);
                    if (byUnit) {
                      for (const [child, childVal] of Object.entries(val)) {
                        if (typeof childVal === 'number') add(unitOf(byUnit[1]), `${key.replace(byUnit[0], '')} ${child}`, childVal);
                      }
                    } else {
                      extractMetrics(val, prefixedKeys.has(key) ? key : prefix);
                    }
                  }
                }
              }
              extractMetrics(entry, '');
            }

            // order by pkc-js version (a backfilled entry is measured long after its release, so its
            // timestamp says nothing about where it belongs); unpublished commits by timestamp
            const commitsSorted = Object.keys(commitTimestampMap).sort((a, b) => {
              const va = commitToVersion[a], vb = commitToVersion[b];
              if (va && vb) return compareVersions(va, vb);
              return commitTimestampMap[a] - commitTimestampMap[b];
            });

            if (commitsSorted.length === 0) continue;

            const median = arr => arr.length ? arr.slice().sort((a,b) => a-b)[Math.floor(arr.length/2)] : null;
            const average = arr => arr.length ? arr.reduce((a,b) => a+b, 0)/arr.length : null;

            for (const unit of unitOrder) {
              const metricGroups = metricsByUnit[unit];
              if (!metricGroups) continue;
              // seconds stack (they are phases of one load); everything else side by side
              const stacked = unit === 'Seconds';
              const datasets = [];
              let colorIndex = 0;

              for (const [metric, commitGroups] of Object.entries(metricGroups)) {
                const medData = [];
                const avgData = [];
                for (const commit of commitsSorted) {
                  const vals = commitGroups[commit] || [];
                  medData.push(vals.length ? +median(vals).toFixed(4) : null);
                  avgData.push(vals.length ? +average(vals).toFixed(4) : null);
                }
                const baseColor = palette[colorIndex % palette.length];
                const common = {borderWidth: 0, borderRadius: 3, barPercentage: 1, categoryPercentage: 1};
                datasets.push({label: prettifyLabel(metric) + ' (Median)', data: medData, backgroundColor: baseColor, ...(stacked ? {stack: 'combined'} : {}), ...common});
                if (stacked) datasets.push({label: prettifyLabel(metric) + ' (Average)', data: avgData, backgroundColor: baseColor + '88', stack: 'combined', ...common});
                colorIndex++;
              }

              if (datasets.length === 0) continue;

              const container = document.createElement('div');
              container.className = 'chart-container';
              container.innerHTML = `
                <h3>${name}${unit === 'Seconds' ? '' : ` — ${unitLabels[unit]}`}${environmentDependent ? ' <span class="env-badge" title="Measures infrastructure this harness does not control (someone else\'s node, production boards, gateways, pubsub providers): it moves with their load and health, not only with pkc-js. Monitoring, not a version comparison.">environment-dependent</span>' : ''}</h3>
                <div class="type-subtitle">${formatType(type)} — Runtime: ${runtime}</div>
                <canvas></canvas>`;
              contentDiv.appendChild(container);

              const ctx = container.querySelector('canvas').getContext('2d');

              new Chart(ctx, {
                type: 'bar',
                data: {
                  labels: commitsSorted.map(commitLabel), // pkc-js version, or short commit hash if unpublished
                  datasets: datasets
                },
                options: {
                  responsive: true,
                  interaction: { mode: 'nearest', intersect: false },
                  plugins: {
                    legend: {
                      position: 'bottom',
                      labels: { color: '#ddd' }
                    },
                    tooltip: {
                      callbacks: {
                        title(ctx) {
                          if (ctx.length > 0) {
                            const idx = ctx[0].dataIndex;
                            const fullHash = commitsSorted[idx];
                            const version = commitToVersion[fullHash];
                            const ts = commitTimestampMap[fullHash];
                            const dateStr = new Date(ts).toLocaleString();
                            const versionLine = version ? `Version: v${version}\n` : '';
                            return `${versionLine}Commit: ${fullHash}\nMeasured: ${dateStr}`;
                          }
                          return '';
                        },
                        label(ctx) {
                          return `${ctx.dataset.label}: ${ctx.parsed.y}`;
                        }
                      }
                    }
                  },
                  scales: {
                    x: {
                      title: { display: true, text: 'pkc-js version', color: '#ddd' },
                      ticks: { color: '#bbb', maxRotation: 90, minRotation: 45, autoSkip: false },
                      grid: { color: 'rgba(255,255,255,0.1)' },
                      stacked,
                      barPercentage: 1,
                      categoryPercentage: 1,
                    },
                    y: {
                      title: { display: true, text: unitLabels[unit], color: '#ddd' },
                      beginAtZero: true,
                      ticks: { color: '#bbb' },
                      grid: { color: 'rgba(255,255,255,0.1)' },
                      stacked
                    }
                  }
                }
              });
            }
          }
        }
      }
    }

    run().catch(console.error);
  </script>
</body>
</html>
